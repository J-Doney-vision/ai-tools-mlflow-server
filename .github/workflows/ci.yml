name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker
        run: docker build -t mlflow-server .
      - name: Test Compose
        run: docker-compose up -d && sleep 10 && curl -f http://localhost:5000 || exit 1